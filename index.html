<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jay Dwarkadhish Shop — self-service print kiosk. Scan QR, upload PDF or photos, pay via UPI, print instantly." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2315172B'/%3E%3Ccircle cx='10' cy='11' r='5' fill='%2300A5C8'/%3E%3Ccircle cx='22' cy='11' r='5' fill='%23E5097F'/%3E%3Ccircle cx='16' cy='21' r='5' fill='%23FFD21F'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Jay Dwarkadhish Shop — Scan • Upload • Print Kiosk</title>

    <!-- Boot monitor: runs even if every module fails — never lets the page go blank -->
    <script>
      (function () {
        var B = (window.__BOOT__ = { stage: "html", errors: [], t0: Date.now() });
        window.addEventListener("error", function (e) {
          B.errors.push((e && e.message) || "script error");
        });
        window.addEventListener("unhandledrejection", function (e) {
          B.errors.push("promise: " + ((e && e.reason && e.reason.message) || "rejected"));
        });

        window.setTimeout(function () {
          if (window.__JD_APP_MOUNTED__) return; /* app healthy — do nothing */

          var reloaded = false;
          try {
            reloaded = sessionStorage.getItem("jd_boot_retry") === "1";
          } catch (err) { /* private mode */ }

          /* self-heal: stale cache → ek baar hard retry */
          if (!reloaded) {
            try { sessionStorage.setItem("jd_boot_retry", "1"); } catch (err) { /* ignore */ }
            window.location.reload();
            return;
          }

          /* still dead → visible diagnostic card (never a blank screen) */
          var card = document.createElement("div");
          card.style.cssText =
            "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;" +
            "background:#15172b;padding:20px;font-family:Archivo,'Segoe UI',sans-serif;";
          card.innerHTML =
            '<div style="max-width:440px;width:100%;background:#fbfbf6;border:2px solid #f1f1ea;box-shadow:8px 8px 0 0 #e5097f;padding:26px 28px;color:#15172b">' +
            '<p style="margin:0;font-family:\'IBM Plex Mono\',monospace;font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#e5097f">Jay Dwarkadhish Shop · Kiosk</p>' +
            '<h1 style="margin:10px 0 8px;font-family:Anton,Impact,sans-serif;font-size:28px;text-transform:uppercase;letter-spacing:.02em">Machine atak gayi</h1>' +
            '<p style="margin:0 0 12px;font-size:13px;line-height:1.5;color:#3a3d56">App start nahi ho payi. Neeche diagnostic hai — <b>Reload</b> dabao, ya internet connection check karke dobara kholo.</p>' +
            '<div style="border:2px dashed rgba(21,23,43,.4);background:#f1f1ea;padding:10px 12px;font-family:\'IBM Plex Mono\',monospace;font-size:11px;word-break:break-word">' +
            "<div>stage: <b>" + B.stage + "</b></div>" +
            "<div>errors: <b>" + (B.errors.length ? B.errors.slice(0, 4).join(" | ") : "none captured") + "</b></div>" +
            "</div>" +
            '<button onclick="try{sessionStorage.removeItem(\'jd_boot_retry\')}catch(e){};location.reload()" ' +
            'style="margin-top:16px;width:100%;border:2px solid #15172b;background:#ffd21f;color:#15172b;font-family:Anton,Impact,sans-serif;font-size:20px;letter-spacing:.05em;text-transform:uppercase;padding:12px;cursor:pointer;box-shadow:4px 4px 0 0 #15172b">' +
            "Reload Machine</button>" +
            "</div>";
          document.body.appendChild(card);
        }, 7000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f1ea; font-family: Archivo, sans-serif; color: #15172b; padding: 24px"
      >
        <div style="border: 2px solid #15172b; background: #fbfbf6; padding: 28px 34px; box-shadow: 6px 6px 0 0 #15172b; text-align: center; max-width: 420px">
          <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #e5097f; font-weight: 700">
            Jay Dwarkadhish Shop · Kiosk
          </p>
          <h1 style="margin: 10px 0 6px; font-family: Anton, Impact, sans-serif; font-size: 30px; letter-spacing: 0.02em; text-transform: uppercase">
            Machine start ho rahi hai…
          </h1>
          <div style="margin: 14px auto 0; width: 180px; height: 10px; border: 2px solid #15172b; background: #fbfbf6; overflow: hidden">
            <div style="width: 100%; height: 100%; background: repeating-linear-gradient(45deg, #ffd21f 0 10px, #15172b 10px 20px); animation: jdstripes 1s linear infinite"></div>
          </div>
          <style>@keyframes jdstripes { from { transform: translateX(0); } to { transform: translateX(-28px); } }</style>
          <p style="margin: 12px 0 0; font-size: 13px; color: rgba(21, 23, 43, 0.6)">
            QR ready · UPI ready · Press warming up
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
