<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jay Dwarkadhish Shop — self-service print kiosk. Scan QR, upload PDF or photos, pay via UPI, print instantly."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2315172B'/%3E%3Ccircle cx='10' cy='11' r='5' fill='%2300A5C8'/%3E%3Ccircle cx='22' cy='11' r='5' fill='%23E5097F'/%3E%3Ccircle cx='16' cy='21' r='5' fill='%23FFD21F'/%3E%3C/svg%3E"
    />

    <!-- Fonts: NON-BLOCKING — page pehle paint hota hai, fonts background mein aati hain.
         Network na ho toh system fonts (Impact/Arial) same look dete hain. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <title>Jay Dwarkadhish Shop — Scan • Upload • Print Kiosk</title>

    <style>
      /* critical inline styles — kisi bhi external file par depend nahi karte */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f1f1ea;
      }
      @keyframes jd-stripes {
        to {
          background-position: 28px 0;
        }
      }
      @keyframes jd-blink {
        50% {
          opacity: 0.25;
        }
      }
      .jd-bar {
        height: 10px;
        border: 2px solid #15172b;
        background: repeating-linear-gradient(45deg, #00a5c8 0 10px, #e5097f 10px 20px, #ffd21f 20px 30px);
        background-size: 28px 28px;
        animation: jd-stripes 0.8s linear infinite;
      }
      .jd-led {
        animation: jd-blink 1.1s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f1ea; font-family: 'Archivo', 'Segoe UI', Tahoma, sans-serif; color: #15172b; padding: 24px"
      >
        <div
          style="border: 2px solid #15172b; background: #fbfbf6; padding: 30px 34px; box-shadow: 6px 6px 0 0 #15172b; text-align: center; max-width: 440px; width: 100%"
        >
          <p
            style="margin: 0; font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #e5097f; font-weight: 700"
          >
            Jay Dwarkadhish Shop · Kiosk
          </p>
          <h1
            style="margin: 10px 0 4px; font-family: 'Anton', Impact, 'Arial Black', sans-serif; font-size: 32px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.05"
          >
            Machine start ho rahi hai<span class="jd-led">…</span>
          </h1>
          <p style="margin: 6px 0 16px; font-size: 13px; color: #3a3d56">
            Press garam ho raha hai — ek second mein ready.
          </p>
          <div class="jd-bar" style="margin-bottom: 14px"></div>
          <p
            style="margin: 0; font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #3a3d56"
          >
            Scan · Upload · Pay · Print
          </p>
        </div>
      </div>
    </div>

    <!-- boot monitor: external JS fail ho jaye tab bhi yeh inline script chalega -->
    <script>
      (function () {
        var boot = (window.__BOOT__ = { stage: "html", errors: [], t0: Date.now() });
        var cap = function (m) {
          if (boot.errors.length < 6 && boot.errors.indexOf(m) === -1) boot.errors.push(m);
        };
        window.addEventListener("error", function (e) {
          cap((e && e.message) || "unknown error");
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          cap(r && r.message ? r.message : String(r));
        });
        setTimeout(function () {
          if (window.__JD_APP_MOUNTED__) return; /* app zinda hai */
          var key = "jd_boot_reload";
          var reloaded = false;
          try {
            reloaded = sessionStorage.getItem(key) === "1";
            if (!reloaded) sessionStorage.setItem(key, "1");
          } catch (err) {
            /* storage unavailable */
          }
          if (!reloaded) {
            /* ek baar auto-reload — stale cache / network hiccup fix */
            window.location.reload();
            return;
          }
          /* diagnostic card — kabhi blank/black screen nahi */
          var root = document.getElementById("root");
          if (root) {
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f1ea;font-family:Archivo,\'Segoe UI\',Tahoma,sans-serif;color:#15172b;padding:24px">' +
              '<div style="border:2px solid #15172b;background:#fbfbf6;padding:28px 30px;box-shadow:6px 6px 0 0 #15172b;max-width:520px;width:100%">' +
              '<p style="margin:0;font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#e5097f;font-weight:700">⚠ Press Jam — Kiosk Boot Report</p>' +
              '<h1 style="margin:10px 0 6px;font-family:Anton,Impact,sans-serif;font-size:28px;text-transform:uppercase">Machine atak gayi</h1>' +
              '<p style="margin:0 0 10px;font-size:13px;color:#3a3d56">Kiosk start nahi ho paya. Details neeche hain — Reload dabao, ya yeh report developer ko bhejo.</p>' +
              '<pre style="margin:0 0 14px;border:2px dashed #15172b;background:#f1f1ea;padding:12px;font-family:\'IBM Plex Mono\',monospace;font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto">' +
              "stage: " + boot.stage + "\nerrors:\n" + (boot.errors.length ? boot.errors.join("\n") : "(koi JS error capture nahi hua — network/JS load issue)") +
              "</pre>" +
              '<button onclick="try{sessionStorage.removeItem(\'jd_boot_reload\')}catch(e){} ; location.reload()" style="width:100%;border:2px solid #15172b;background:#ffd21f;color:#15172b;font-family:Anton,Impact,sans-serif;font-size:20px;letter-spacing:.05em;text-transform:uppercase;padding:12px;cursor:pointer;box-shadow:3px 3px 0 0 #15172b">Reload Kiosk</button>' +
              "</div></div>";
          }
        }, 8000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
